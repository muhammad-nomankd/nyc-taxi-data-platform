[project]
name = "taxi-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "requests",
    "tenacity",
    "pydantic-settings",
    "pyarrow",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-mock", "responses", "ruff", "mypy", "pre-commit"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/taxi_pipeline"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
